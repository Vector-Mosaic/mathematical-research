[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-attempt-adapter"
version = "0.1.0"
description = "Durable formal research execution, reconciliation, and artifact custody"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Justin Sublette"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["research_attempt_adapter*"]
exclude = ["research_attempt_adapter.tests*"]
